name: nova-event

# Imágenes construidas por GitHub Actions (.github/workflows/imagenes.yml) y publicadas en ghcr.io.
# En el servidor no se construye nada: deploy.sh descarga la imagen del commit (TAG) y levanta.
# Para construir aquí a mano: docker compose up --build -d

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nova_event}
      POSTGRES_USER: ${POSTGRES_USER:-nova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Expuesto solo en esta máquina, para desarrollo local (npm run dev).
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crea o actualiza las tablas desde src/db/schema.ts y carga los datos iniciales; termina y deja paso a la app.
  # Si un cambio de tablas pudiera borrar datos, se detiene sin aplicarlo.
  migrate:
    image: ghcr.io/${GHCR_OWNER:-local}/nova-event-migrate:${TAG:-latest}
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nova}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nova_event}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/${GHCR_OWNER:-local}/nova-event-app:${TAG:-latest}
    build:
      context: .
      target: runner
      args:
        GIT_SHA: ${TAG:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nova}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nova_event}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
