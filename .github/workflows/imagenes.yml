# Construye las imágenes Docker en cada push a main y las publica en ghcr.io.
# El servidor solo las descarga con deploy.sh (no construye nada).
name: Imágenes Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

# Si llegan dos push seguidos, se cancela el build viejo.
concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - servicio: app
            target: runner
          - servicio: migrate
            target: migrator
    steps:
      - uses: actions/checkout@v4

      # ghcr.io exige el nombre en minúsculas.
      - name: Nombre de la imagen
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nova-event-${{ matrix.servicio }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}
